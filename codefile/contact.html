
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../style.css">

    <title>Contact | Shabnam Shaikh</title>
</head>

<body>

<header>
    <a href="#" class="logo">Shabnam Shaikh</a>

    <nav>
        <a href="../index.html">Home</a>
<a href="about.html" >About</a>
<a href="skills.html">Skills</a>

<a href="project.html">Projects</a>
<a href="article.html">Articles</a>
<a href="contact.html"class="active">Contact</a>
    </nav>
</header>

<section style="
    min-height:100vh;
    background:#050505;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:100px 8% 50px;
">

    <div style="
        width:100%;
        max-width:750px;
        text-align:center;
    ">

        <h1 style="
            color:white;
            font-size:3.8rem;
            margin-bottom:15px;
            text-shadow:0 0 15px rgba(200,0,0,0.4);
        ">
            Get In <span style="color:#e00000;">Touch</span>
        </h1>

        <p style="
            color:#aaa;
            font-size:1.5rem;
            line-height:1.7;
            margin-bottom:35px;
        ">
            Have a project, an idea, or an opportunity?
            I'd love to hear from you. Let's connect and create something meaningful!
        </p>

        <!-- Contact Form -->
        <form onsubmit="sendEmail(event)" style="
            padding:35px;
            background:rgba(255,255,255,0.04);
            border:1px solid rgba(220,0,0,0.7);
            border-radius:18px;
            backdrop-filter:blur(15px);
            box-shadow:0 0 20px rgba(200,0,0,0.2);
            display:flex;
            flex-direction:column;
            gap:20px;
        ">

            <input type="text" id="name"
                placeholder="Your Name" required
                style="width:100%; box-sizing:border-box; padding:16px; background:rgba(255,255,255,0.06); border:1px solid #b90000; border-radius:10px; color:white; font-size:1.5rem; outline:none;">

            <input type="email" id="email"
                placeholder="Your Email Address" required
                style="width:100%; box-sizing:border-box; padding:16px; background:rgba(255,255,255,0.06); border:1px solid #b90000; border-radius:10px; color:white; font-size:1.5rem; outline:none;">

            <input type="text" id="subject"
                placeholder="Subject" required
                style="width:100%; box-sizing:border-box; padding:16px; background:rgba(255,255,255,0.06); border:1px solid #b90000; border-radius:10px; color:white; font-size:1.5rem; outline:none;">

            <textarea id="message"
                placeholder="Write your message here..."
                rows="6" required
                style="width:100%; box-sizing:border-box; padding:16px; background:rgba(255,255,255,0.06); border:1px solid #b90000; border-radius:10px; color:white; font-size:1.5rem; outline:none; resize:vertical;"></textarea>

            <button type="submit" style="
                padding:16px;
                background:#b90000;
                color:white;
                border:1px solid #ff3030;
                border-radius:30px;
                font-size:1.6rem;
                font-weight:bold;
                cursor:pointer;
                box-shadow:0 0 15px rgba(220,0,0,0.5);
                transition:0.3s;
            ">
                <i class="fa-solid fa-paper-plane"></i>
                Send Message
            </button>

        </form>

        <p style="
            color:#888;
            font-size:1.3rem;
            margin-top:20px;
        ">
            <i class="fa-solid fa-envelope" style="color:#e00000;"></i>
            shabnamshaikh.2614@gmail.com
        </p>

        <!-- Social Media -->
        <div style="
            margin-top:35px;
            display:flex;
            justify-content:center;
            gap:30px;
        ">

            <a href="https://www.instagram.com/shabnamvibes/"
               target="_blank" aria-label="Instagram"
               style="color:white; font-size:2.8rem; transition:0.3s;">
                <i class="fa-brands fa-instagram"></i>
            </a>

            <a href="https://www.linkedin.com/in/shabnam-shaikh97/"
               target="_blank" aria-label="LinkedIn"
               style="color:white; font-size:2.8rem; transition:0.3s;">
                <i class="fa-brands fa-linkedin"></i>
            </a>

            <a href="https://github.com/ShabnamShaikh2614"
               target="_blank" aria-label="GitHub"
               style="color:white; font-size:2.8rem; transition:0.3s;">
                <i class="fa-brands fa-github"></i>
            </a>

        </div>

        <p style="
            color:#666;
            font-size:1.2rem;
            margin-top:35px;
        ">
            © 2026 Shabnam Shaikh | Designed with passion.
        </p>

    </div>

</section>

<script>
function sendEmail(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const subject = document.getElementById("subject").value.trim();
    const message = document.getElementById("message").value.trim();

    const recipient = "shabnamshaikh.2614@gmail.com";

    const body =
        "Name: " + name + "\n" +
        "Email: " + email + "\n\n" +
        "Message:\n" + message;

    const mailtoLink =
        "mailto:" + recipient +
        "?subject=" + encodeURIComponent(subject) +
        "&body=" + encodeURIComponent(body);

    window.location.href = mailtoLink;
}
</script>

</body>
</html>
